name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.0)'
        required: true
      dry_run:
        description: 'Build artifacts only; skip GitHub Release creation'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            archive: tar.gz
            shell: bash
            publish_mode: selfcontained
          - os: ubuntu-latest
            rid: linux-x64
            archive: tar.gz
            shell: bash
            publish_mode: fxdependent
          - os: windows-latest
            rid: win-x64
            archive: zip
            shell: pwsh
            publish_mode: selfcontained
          - os: windows-latest
            rid: win-x64
            archive: zip
            shell: pwsh
            publish_mode: fxdependent
          - os: macos-latest
            rid: osx-arm64
            archive: tar.gz
            shell: bash
            publish_mode: selfcontained
          - os: macos-latest
            rid: osx-arm64
            archive: tar.gz
            shell: bash
            publish_mode: fxdependent
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Configure NuGet package cache
        shell: bash
        run: |
          cache_root="${RUNNER_TEMP:-/tmp}"
          echo "NUGET_PACKAGES=${cache_root}/nuget" >> "$GITHUB_ENV"

      - name: Download Tree-sitter natives
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TREE_SITTER_NATIVES_REPO: ${{ github.repository }}
        run: |
          chmod +x scripts/*.sh
          if [[ -d "native/${{ matrix.rid }}" && -n "$(find "native/${{ matrix.rid }}" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | head -1)" ]]; then
            echo "Using existing natives in native/${{ matrix.rid }} (local/act cache)."
          else
            ./scripts/download-tree-sitter-natives.sh --rid "${{ matrix.rid }}"
          fi

      - name: Publish release (Unix)
        if: matrix.shell == 'bash'
        shell: bash
        run: |
          SELF_CONTAINED=false
          if [[ "${{ matrix.publish_mode }}" == "selfcontained" ]]; then
            SELF_CONTAINED=true
          fi
          ./scripts/publish-release.sh \
            --rid "${{ matrix.rid }}" \
            --version "${{ steps.version.outputs.value }}" \
            --self-contained "$SELF_CONTAINED" \
            --skip-natives

      - name: Publish release (Windows)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: |
          ./scripts/publish-release.ps1 `
            -Rid "${{ matrix.rid }}" `
            -Version "${{ steps.version.outputs.value }}" `
            -SelfContained $(if ("${{ matrix.publish_mode }}" -eq "selfcontained") { "true" } else { "false" }) `
            -SkipNatives

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Edit-${{ steps.version.outputs.value }}-${{ matrix.rid }}-${{ matrix.publish_mode }}
          path: artifacts/Edit-${{ steps.version.outputs.value }}-${{ matrix.rid }}-${{ matrix.publish_mode }}.*
          if-no-files-found: error

  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Edit v${{ steps.version.outputs.value }}
          generate_release_notes: true
          files: artifacts/*
          fail_on_unmatched_files: true
